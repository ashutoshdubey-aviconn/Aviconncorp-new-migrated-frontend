name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18,20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        env:
          CI: true

      - name: Run build
        run: npm run build --if-present
        env:
          CI: true

      - name: Run unit tests (Karma)
        # Karma + ChromeHeadless should run on the hosted runner; pass --watch=false to exit
        run: npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CI: true
